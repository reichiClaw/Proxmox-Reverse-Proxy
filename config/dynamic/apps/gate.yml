# Admin GUI for managing Gate routes/settings.
# Intended to be reachable from the internet; protection is the Gate login
# (bcrypt password + CSRF + per-IP lockout) plus auth-ratelimit at the edge.
# Optional extra hardening: uncomment admin-allowlist below.
# https://gate.example.com

http:
  routers:
    gate:
      rule: "Host(`gate.example.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: le
      service: gate
      middlewares:
        - secured
        - gate-errors
        # - admin-allowlist   # optional: restrict to private/VPN IPs
        - auth-ratelimit
        - gate-buffering

  services:
    gate:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8080"
    # Used only by the gate-errors middleware (Traefik fetches this itself
    # from localhost when admin-allowlist is enabled).
    gate-error-pages:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
