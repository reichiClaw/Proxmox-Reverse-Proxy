# Admin GUI for managing Gate routes/settings.
# Point upstream at the host/port where `python -m gui` listens.
# https://gate.example.com

http:
  routers:
    gate:
      rule: "Host(`gate.example.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: le
      service: gate
      middlewares:
        - secured
        - gate-errors
        - admin-allowlist
        - auth-ratelimit
        - gate-buffering

  services:
    gate:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8080"
    # Used only by the gate-errors middleware (Traefik fetches this itself
    # from localhost — not subject to admin-allowlist on the client path).
    gate-error-pages:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
