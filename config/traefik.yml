# Static Traefik config — entrypoints, ACME, providers.
# Service routes live in dynamic/ and are hot-reloaded.
# TLS options (min version, ciphers) live in dynamic/tls.yml.

# The API/dashboard is disabled by default to keep the attack surface small.
# To enable it, set dashboard: true AND publish api@internal behind a router
# with authentication + an IP allowlist. Never set api.insecure: true.
api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        # Port 80 only serves redirects and ACME HTTP-01 — keep it tight.
        readTimeout: 30s
        idleTimeout: 60s
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # readTimeout/writeTimeout are 0 (disabled) on purpose: Proxmox ISO
        # uploads, backup restores, and long-lived noVNC/xterm.js WebSockets
        # legitimately exceed any fixed request deadline. Slow-client abuse is
        # bounded by idleTimeout plus the rate-limit middlewares in
        # dynamic/middlewares.yml.
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 180s
    http:
      tls:
        certResolver: le
    # Traefik drops client-supplied X-Forwarded-* headers by default.
    # Only add trustedIPs if a load balancer / CDN you control sits in front:
    # forwardedHeaders:
    #   trustedIPs:
    #     - "192.0.2.10/32"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      # Set to your address; mirror config/base.env ACME_EMAIL when deploying.
      email: admin@example.com
      storage: /var/lib/traefik/acme.json
      # Use staging until the gate works end-to-end, then switch to production.
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      # Production:
      # caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
      # For wildcard certs (*.example.com) and easier subdomain adds, prefer DNS-01:
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 0

log:
  level: INFO

# Access logs: request metadata only. Header logging stays off (default) so
# Cookie / Authorization / PVE tickets are never written to disk.
accessLog: {}
